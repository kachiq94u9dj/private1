name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: D1 のデータベース ID を設定
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then echo "リポジトリ変数 D1_DATABASE_ID を設定してください" >&2; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc
      - run: npx vite build
      - name: マイグレーション適用
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: デプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Worker のシークレットと変数を同期
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # 値が設定されているものだけ送る（値はログに出さない）
          node -e '
            const keys = ["INGEST_TOKEN","ANTHROPIC_API_KEY","SLACK_WEBHOOK_URL","ACCESS_TEAM_DOMAIN","ACCESS_AUD","APP_URL"];
            const out = Object.fromEntries(keys.filter(k => process.env[k]).map(k => [k, process.env[k]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("syncing:", Object.keys(out).join(", ") || "(none)");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json
